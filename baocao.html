<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Cáo Công Việc</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d2e;
            --teacher-color: #0b694a;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 20px;
            font-size: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- HEADER & NAVBAR --- */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--secondary-color);
            margin-bottom: 30px;
            padding: 0 10px 0 20px;
            border-radius: 8px;
        }

        .logo-box {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 45px;
            object-fit: contain;
            margin: 10px 0;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            height: 100%;
        }

        .nav-item {
            text-decoration: none;
            color: #333;
            padding: 22px 25px;
            font-weight: 500;
            font-size: 15px;
            transition: background-color 0.2s;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
        }

        .nav-item:hover {
            background-color: #e2e8f0;
        }

        .nav-item.active {
            background-color: #ffffff;
            border-bottom: 3px solid #000000;
            font-weight: bold;
        }

        .header-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 22px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* --- VÙNG LỌC DỮ LIỆU --- */
        .filter-section {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: var(--secondary-color);
            padding: 20px;
            border-radius: 8px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-weight: 600;
            color: #4a5568;
            font-size: 13px;
            text-transform: uppercase;
        }

        .filter-group input, .filter-group select {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #cbd5e0;
            outline: none;
            font-size: 14px;
            min-width: 160px;
            background-color: white;
            font-family: inherit;
        }

        .filter-group input:focus, .filter-group select:focus {
            border-color: var(--primary-color);
        }

        .btn {
            padding: 10px 20px;
            border-radius: 4px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-left: auto;
        }

        .btn-filter-export {
            background-color: #2563eb;
            color: white;
        }

        .btn-filter-export:hover { background-color: #1d4ed8; }

        /* --- BẢNG DỮ LIỆU --- */
        .table-responsive {
            overflow-x: auto;
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        thead {
            background-color: var(--primary-color);
            color: white;
        }

        th, td {
            padding: 14px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: left;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        td { font-size: 14px; line-height: 1.5; }

        tbody tr:nth-child(even) { background-color: #fbfbfb; }
        tbody tr:hover { background-color: #f1f5f9; }

        .empty-message {
            text-align: center;
            padding: 40px;
            color: #718096;
            font-style: italic;
        }

        .section-note {
            font-size: 13px;
            color: #64748b;
            font-style: italic;
            margin-bottom: 10px;
            display: block;
        }

        #loading {
            text-align: center;
            padding: 20px;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 16px;
            display: none;
        }

        @media (max-width: 768px) {
            .top-navbar { flex-direction: column; padding: 15px; }
            .filter-section { flex-direction: column; align-items: stretch; }
            .btn { margin-left: 0; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER NAVBAR -->
        <div class="top-navbar">
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/khcbvadl-ai/quanlidulieu/main/logo.%20KHCB%20trong.png" alt="KHCB LOGO" class="logo-img">
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item">Trang chủ</a>
                <a href="#" class="nav-item">Lịch giảng</a>
                <a href="#" class="nav-item active">Báo cáo công việc</a>
            </div>
        </div>

        <h2 class="header-title"><i class="fa-solid fa-chart-line"></i> THỐNG KÊ BÁO CÁO CÔNG VIỆC</h2>

        <!-- BỘ LỌC -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="filter-name">Nhân sự:</label>
                <select id="filter-name">
                    <option value="ALL">-- Tất cả nhân sự --</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-start-date">Từ ngày:</label>
                <input type="date" id="filter-start-date">
            </div>
            <div class="filter-group">
                <label for="filter-end-date">Đến ngày:</label>
                <input type="date" id="filter-end-date">
            </div>
            <!-- Đã gộp nút thống kê và tải thành 1 hành động -->
            <button class="btn btn-filter-export" onclick="applyFilter(true)"><i class="fa-solid fa-file-arrow-down"></i> Lọc & Tải báo cáo</button>
        </div>

        <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>

        <!-- BẢNG HIỂN THỊ -->
        <span id="display-note" class="section-note">Đang hiển thị 10 công việc gần nhất</span>
        <div class="table-responsive">
            <table id="report-table" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 60px; text-align: center;">STT</th>
                        <th style="width: 140px;">NGÀY BÁO CÁO</th>
                        <th style="width: 200px;">HỌ VÀ TÊN</th>
                        <th>MÔ TẢ CÔNG VIỆC</th>
                        <th style="width: 150px;">NGÀY THỰC HIỆN</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu sẽ đổ vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = "1jTx3rQ5G3Q8KQ3h2qy0CTtmZ725tEJ8QmAJTr6ZkOeY";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
        
        let allReportData = [];
        let filteredDataForExport = [];

        // BỘ TỪ ĐIỂN CHUẨN HÓA TÊN
        const NAME_DICTIONARY = {
            "nguyễn ngọcc hải": "Nguyễn Ngọc Hải",
            "nguyển ngọc hải": "Nguyễn Ngọc Hải",
            "nguyen ngoc hai": "Nguyễn Ngọc Hải",
            "lê thị duyênn": "Lê Thị Duyên",
            "trần văn thời": "Trần Văn Thời"
        };

        function sanitizeName(rawName) {
            if (!rawName) return "Không rõ";
            let cleaned = rawName.trim().replace(/\s+/g, ' ');
            let lowerCaseName = cleaned.toLowerCase();
            if (NAME_DICTIONARY[lowerCaseName]) return NAME_DICTIONARY[lowerCaseName];
            return cleaned.replace(/(^\w{1})|(\s+\w{1})/g, letter => letter.toUpperCase());
        }

        window.onload = function() {
            fetchDataFromSheet();
        };

        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        function parseGoogleDate(dateStr) {
            if (!dateStr) return null;
            let parts = dateStr.split(' ')[0].split('/'); 
            if (parts.length === 3) {
                return new Date(parts[2], parts[0] - 1, parts[1]);
            }
            return new Date(dateStr);
        }

        function formatDateUI(dateObj) {
            if (!dateObj || isNaN(dateObj.getTime())) return "";
            let d = dateObj.getDate().toString().padStart(2, '0');
            let m = (dateObj.getMonth() + 1).toString().padStart(2, '0');
            let y = dateObj.getFullYear();
            return `${d}/${m}/${y}`;
        }

        function fetchDataFromSheet() {
            document.getElementById('loading').style.display = 'block';

            fetch(CSV_URL)
                .then(response => response.text())
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let rawData = [];
                    
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        let cols = parseCSVLine(lines[i]);
                        
                        if (cols.length >= 4) {
                            let rawTimestamp = cols[0].trim();
                            let rawName = cols[1].trim();
                            let desc = cols[2].trim();
                            let rawDoneDate = cols[3].trim();
                            
                            if (!rawTimestamp && !rawName) continue;

                            let dateReportObj = parseGoogleDate(rawTimestamp);

                            rawData.push({
                                timestampObj: dateReportObj,
                                timestampUI: formatDateUI(dateReportObj),
                                name: sanitizeName(rawName),
                                description: desc,
                                dateDoneUI: rawDoneDate 
                            });
                        }
                    }

                    // Sắp xếp báo cáo mới nhất lên đầu
                    rawData.sort((a, b) => b.timestampObj - a.timestampObj);

                    allReportData = rawData;
                    
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('schedule-table').style.display = 'table';
                    
                    populateNameDropdown();
                    
                    // Lần đầu mở trang web: isUserAction = false -> Hiển thị 10 mục
                    applyFilter(false); 
                })
                .catch(err => {
                    console.error("Lỗi tải dữ liệu:", err);
                    document.getElementById('loading').innerHTML = '<span style="color:red">Lỗi tải dữ liệu. Hãy chắc chắn Sheet đã được cấp quyền Chia sẻ (Anyone with the link).</span>';
                });
        }

        function populateNameDropdown() {
            const nameSelect = document.getElementById('filter-name');
            nameSelect.innerHTML = '<option value="ALL">-- Tất cả nhân sự --</option>';
            
            let names = new Set();
            allReportData.forEach(item => {
                if (item.name && item.name !== "Không rõ") names.add(item.name);
            });

            Array.from(names).sort((a,b) => a.localeCompare(b, 'vi')).forEach(name => {
                let option = document.createElement('option');
                option.value = name;
                option.textContent = name;
                nameSelect.appendChild(option);
            });
        }

        // isUserAction = false (Lúc mới vào trang), isUserAction = true (Khi bấm Lọc & Tải)
        function applyFilter(isUserAction = false) {
            const selectedName = document.getElementById('filter-name').value;
            const startDateInput = document.getElementById('filter-start-date').value;
            const endDateInput = document.getElementById('filter-end-date').value;

            let start = startDateInput ? new Date(startDateInput) : null;
            if (start) start.setHours(0,0,0,0);
            
            let end = endDateInput ? new Date(endDateInput) : null;
            if (end) end.setHours(23,59,59,999);

            // Lọc dữ liệu theo điều kiện
            let filteredData = allReportData.filter(item => {
                let matchName = (selectedName === "ALL") || (item.name === selectedName);
                
                let matchDate = true;
                if (item.timestampObj) {
                    if (start && item.timestampObj < start) matchDate = false;
                    if (end && item.timestampObj > end) matchDate = false;
                }
                
                return matchName && matchDate;
            });

            filteredDataForExport = filteredData;
            const displayNote = document.getElementById('display-note');

            if (!isUserAction) {
                // Lúc mới mở web: Cắt lấy 10 phần tử đầu tiên
                displayNote.textContent = "Đang hiển thị 10 công việc mới nhất";
                renderTable(filteredData.slice(0, 10));
            } else {
                // Khi người dùng tương tác: Hiển thị toàn bộ kết quả lọc & Tải file
                displayNote.textContent = `Đang hiển thị kết quả lọc (${filteredData.length} công việc)`;
                renderTable(filteredData);
                
                if (filteredData.length > 0) {
                    exportToWord();
                } else {
                    alert("Không tìm thấy công việc nào thỏa mãn điều kiện lọc để xuất file.");
                }
            }
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-message">Không có dữ liệu báo cáo nào.</td></tr>';
                return;
            }

            dataArray.forEach((item, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; text-align: center;">${index + 1}</td>
                    <td style="color: #64748b; font-size: 13px;">${item.timestampUI}</td>
                    <td style="font-weight: bold; color: var(--teacher-color);">${item.name}</td>
                    <td>${item.description}</td>
                    <td style="font-style: italic; color: #475569;">${item.dateDoneUI}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // ==========================================
        // TÍNH NĂNG XUẤT FILE WORD (.DOC)
        // ==========================================
        function exportToWord() {
            const selectedName = document.getElementById('filter-name').value;
            let reportTitle = selectedName === "ALL" ? "BÁO CÁO CÔNG VIỆC CHUNG" : `BÁO CÁO CÔNG VIỆC - ${selectedName.toUpperCase()}`;
            
            let tableContent = "";
            filteredDataForExport.forEach((item, index) => {
                tableContent += `
                    <tr>
                        <td style="border: 1px solid #000; padding: 8px; text-align: center;">${index + 1}</td>
                        <td style="border: 1px solid #000; padding: 8px;">${item.timestampUI}</td>
                        <td style="border: 1px solid #000; padding: 8px;">${item.name}</td>
                        <td style="border: 1px solid #000; padding: 8px;">${item.description}</td>
                        <td style="border: 1px solid #000; padding: 8px;">${item.dateDoneUI}</td>
                    </tr>
                `;
            });

            let htmlSource = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset='utf-8'>
                    <title>Báo cáo</title>
                    <style>
                        body { font-family: 'Times New Roman', serif; }
                        table { border-collapse: collapse; width: 100%; margin-top: 20px; }
                        th { background-color: #d1d5db; border: 1px solid #000; padding: 10px; font-weight: bold; }
                        h2 { text-align: center; color: #1a4d2e; margin-bottom: 20px; }
                        .info { text-align: right; font-style: italic; margin-bottom: 30px; }
                    </style>
                </head>
                <body>
                    <h2>${reportTitle}</h2>
                    <p class="info">Xuất ngày: ${formatDateUI(new Date())}</p>
                    <table>
                        <thead>
                            <tr>
                                <th style="width: 5%;">STT</th>
                                <th style="width: 15%;">Ngày báo cáo</th>
                                <th style="width: 20%;">Họ và tên</th>
                                <th style="width: 45%;">Mô tả công việc</th>
                                <th style="width: 15%;">Ngày thực hiện</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${tableContent}
                        </tbody>
                    </table>
                </body>
                </html>
            `;

            let blob = new Blob(['\ufeff', htmlSource], { type: 'application/msword' });
            let downloadLink = document.createElement("a");
            downloadLink.href = URL.createObjectURL(blob);
            
            let fileName = selectedName === "ALL" ? "Bao_Cao_Chung.doc" : `Bao_Cao_${selectedName.replace(/\s+/g, '_')}.doc`;
            downloadLink.download = fileName;
            
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
        }
    </script>
</body>
</html>
