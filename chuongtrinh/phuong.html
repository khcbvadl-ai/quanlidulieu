<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tra Cứu Học Sinh Tối Ưu</title>
    <!-- Nhúng Tailwind CSS để giao diện hiển thị chuẩn -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen py-10 px-4">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">HỆ THỐNG TRA CỨU THÔNG TIN HỌC SINH</h1>
        
        <!-- Giai đoạn 1: Chỉ tải cột Tên -->
        <div id="loadingStatus" class="text-center text-gray-500 font-medium my-4">🔄 Đang tải danh sách tên học sinh...</div>

        <!-- Khung tìm kiếm -->
        <div id="searchSection" class="hidden mb-6">
            <label for="studentSearch" class="block text-sm font-medium text-gray-700 mb-2">Nhập tên học sinh để tìm kiếm:</label>
            <input type="text" id="studentSearch" list="studentSuggestions" placeholder="Ví dụ: Hồ Minh Anh..." 
                   class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
            <datalist id="studentSuggestions"></datalist>
        </div>

        <!-- Trạng thái tải điểm khi click chọn tên (Giai đoạn 2) -->
        <div id="scoreLoading" class="hidden text-center text-blue-500 font-medium my-4">⏳ Đang lấy bảng điểm chi tiết từ hệ thống...</div>

        <!-- Khung hiển thị thông tin chi tiết -->
        <div id="resultCard" class="hidden border border-gray-200 rounded-lg p-5 bg-gray-50">
            <h2 id="studentNameTitle" class="text-xl font-bold mb-4 pb-2 border-b border-gray-300 text-blue-600"></h2>
            
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 bg-white shadow-sm rounded-lg overflow-hidden">
                    <thead class="bg-blue-500 text-white">
                        <tr>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider w-1/3">Nội dung / Tiêu chí</th>
                            <th class="px-4 py-3 text-left text-xs font-semibold uppercase tracking-wider">Kết quả đánh giá</th>
                        </tr>
                    </thead>
                    <tbody id="resultTableBody" class="divide-y divide-gray-200 text-sm"></tbody>
                </table>
            </div>
        </div>
        
        <div id="notFoundMessage" class="hidden text-center text-red-500 my-4 font-medium">
            ⚠️️ Không tìm thấy học sinh này. Vui lòng chọn đúng tên trong danh sách gợi ý!
        </div>
    </div>

    <script>
        // Đường link chia sẻ Google Sheets
        const GOOGLE_SHEET_SHARE_URL = 'https://docs.google.com/spreadsheets/d/1cQP8W0yMFM5RJ6yMX6nkhTWVj5FfF-OYYVjHyGwwF2k/edit?gid=2032778216#gid=2032778216'; 
        
        let sheetId = '';
        let sheetGid = '';
        let studentList = [];

        // Trích xuất ID và GID từ link chia sẻ
        function initBaseUrl() {
            const matchId = GOOGLE_SHEET_SHARE_URL.match(/\/d\/([^/]+)/);
            const matchGid = GOOGLE_SHEET_SHARE_URL.match(/gid=([0-9]+)/);

            if (matchId) {
                sheetId = matchId[1];
                sheetGid = matchGid ? matchGid[1] : '0';
                loadOnlyStudentNames(); // Chạy giai đoạn 1 ngay lập tức
            } else {
                document.getElementById('loadingStatus').innerText = "❌ Link Google Sheets sai định dạng!";
            }
        }

        // GIAI ĐOẠN 1: Chỉ quét duy nhất cột B (Cột Họ và Tên)
        function loadOnlyStudentNames() {
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?gid=${sheetGid}&tqx=out:json&tq=SELECT B`;

            fetch(url)
                .then(res => res.text())
                .then(txt => {
                    const jsonString = txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1);
                    const data = JSON.parse(jsonString);
                    
                    // Gom toàn bộ tên học sinh vào mảng bộ nhớ tạm
                    studentList = data.table.rows
                        .map(row => row.c && row.c[0] ? (row.c[0].v ? String(row.c[0].v).trim() : "") : "")
                        .filter(name => name !== "" && name.toLowerCase() !== "họ và tên" && name.toLowerCase() !== "họ tên");

                    // Đổ dữ liệu tên vào ô gợi ý
                    const datalist = document.getElementById('studentSuggestions');
                    datalist.innerHTML = studentList.map(name => `<option value="${name}"></option>`).join('');

                    // Mở khóa khung tìm kiếm
                    document.getElementById('loadingStatus').classList.add('hidden');
                    document.getElementById('searchSection').classList.remove('hidden');
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById('loadingStatus').innerText = "❌ Lỗi kết nối. Hãy kiểm tra lại quyền chia sẻ trang tính (Xem công khai).";
                });
        }

        // LẮNG NGHE SỰ KIỆN: Khi người dùng chọn tên
        document.getElementById('studentSearch').addEventListener('input', function(e) {
            const selectedName = e.target.value.trim();
            
            const resultCard = document.getElementById('resultCard');
            const notFoundMessage = document.getElementById('notFoundMessage');
            const scoreLoading = document.getElementById('scoreLoading');

            // Kiểm tra tên nhập vào có trong danh sách hay không
            const isMatch = studentList.some(name => name.toLowerCase() === selectedName.toLowerCase());

            if (isMatch) {
                notFoundMessage.classList.add('hidden');
                resultCard.classList.add('hidden'); // Ẩn bảng cũ
                scoreLoading.classList.remove('hidden'); // Hiện thông báo đang tải điểm

                // GIAI ĐOẠN 2: Lấy dữ liệu chi tiết của học sinh được chọn
                loadSingleStudentScores(selectedName);
            } else {
                resultCard.classList.add('hidden');
                if (selectedName.length > 0) {
                    notFoundMessage.classList.remove('hidden');
                } else {
                    notFoundMessage.classList.add('hidden');
                }
            }
        });

        // GIAI ĐOẠN 2: Tải điểm và các tiêu đề cột tương ứng
        function loadSingleStudentScores(studentName) {
            const encodedQuery = encodeURIComponent(`SELECT * WHERE B = '${studentName}'`);
            const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?gid=${sheetGid}&tqx=out:json&tq=${encodedQuery}`;

            fetch(url)
                .then(res => res.text())
                .then(txt => {
                    const jsonString = txt.substring(txt.indexOf("{"), txt.lastIndexOf("}") + 1);
                    const data = JSON.parse(jsonString);
                    
                    if (data.table && data.table.rows.length > 0) {
                        renderTable(data.table);
                    } else {
                        alert("Không tìm thấy kết quả chi tiết cho học sinh này!");
                        document.getElementById('scoreLoading').classList.add('hidden');
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Không thể tải điểm, vui lòng thử lại!");
                    document.getElementById('scoreLoading').classList.add('hidden');
                });
        }

        // Dựng bảng hiển thị kết quả
        function renderTable(table) {
            const scoreLoading = document.getElementById('scoreLoading');
            const resultCard = document.getElementById('resultCard');
            const tableBody = document.getElementById('resultTableBody');

            // 1. Đọc tên các cột
            const headers = table.cols.map(col => col.label ? col.label.trim() : "");
            
            // 2. Lấy hàng dữ liệu
            const rowData = table.rows[0].c;

            // Tìm vị trí STT và Họ tên
            const sttIndex = headers.findIndex(h => h.toLowerCase().includes("stt"));
            const nameIndex = headers.findIndex(h => h.toLowerCase().includes("họ và tên") || h.toLowerCase().includes("họ tên"));
            
            const sttVal = (sttIndex !== -1 && rowData[sttIndex]) ? (rowData[sttIndex].v || "-") : "-";
            const nameVal = (nameIndex !== -1 && rowData[nameIndex]) ? (rowData[nameIndex].v || "-") : "-";
            
            document.getElementById('studentNameTitle').innerText = `Học sinh: ${nameVal} ${sttVal !== '-' ? `(STT: ${sttVal})` : ''}`;
            
            // Xóa dữ liệu cũ
            tableBody.innerHTML = '';

            // 3. Hiển thị từng thuộc tính theo chiều dọc
            headers.forEach((colName, index) => {
                // Bỏ qua cột trống, cột STT và cột Họ Tên
                if (!colName || index === sttIndex || index === nameIndex) return;

                const cell = rowData[index];
                const value = cell ? (cell.f ? cell.f : (cell.v !== null ? String(cell.v) : "")) : "";

                const isSpecialRow = colName.includes("Ghi chú") || colName.includes("Tổng hợp");
                const rowClass = isSpecialRow ? 'bg-yellow-50 font-medium' : '';

                const row = `
                    <tr class="${rowClass}">
                        <td class="px-4 py-3 font-semibold text-gray-600 border-r border-gray-100">${colName}</td>
                        <td class="px-4 py-3 text-gray-800 whitespace-pre-line">${value}</td>
                    </tr>
                `;
                tableBody.insertAdjacentHTML('beforeend', row);
            });

            // Hiển thị bảng kết quả
            scoreLoading.classList.add('hidden');
            resultCard.classList.remove('hidden');
        }

        // Khởi chạy khi tải trang
        window.onload = initBaseUrl;
    </script>
</body>
</html>
