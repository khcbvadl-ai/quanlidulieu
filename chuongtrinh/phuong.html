<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thống Kê Đăng Ký Nước</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d2e;
            --teacher-color: #0b694a;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #cbd5e1;
            --accent-color: #d97706;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 20px;
            font-size: 14px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* --- HEADER & NAVBAR --- */
        .top-navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--secondary-color); margin-bottom: 25px; padding: 10px 20px;
            border-radius: 8px;
        }
        .logo-box { display: flex; align-items: center; }
        .logo-img { height: 45px; object-fit: contain; }
        .nav-menu { display: flex; list-style: none; height: 100%; }
        .nav-item {
            text-decoration: none; color: #333; padding: 12px 20px; font-weight: 500; font-size: 15px;
            transition: background-color 0.2s; border-bottom: 3px solid transparent; display: flex; align-items: center;
        }
        .nav-item:hover { background-color: #e2e8f0; }
        .nav-item.active { background-color: #ffffff; border-bottom: 3px solid #000000; font-weight: bold; }

        .header-title {
            text-align: center; color: var(--primary-color); margin-bottom: 25px;
            font-size: 22px; text-transform: uppercase; font-weight: 700;
        }

        /* --- BỘ LỌC DỮ LIỆU --- */
        .filter-section {
            display: flex; gap: 20px; margin-bottom: 25px; background: var(--secondary-color);
            padding: 15px 20px; border-radius: 8px; align-items: center; flex-wrap: wrap;
        }
        .filter-group { display: flex; align-items: center; gap: 10px; }
        .filter-group label { font-weight: 600; color: #4a5568; font-size: 13px; text-transform: uppercase; }
        .filter-group select {
            padding: 8px 12px; border-radius: 4px; border: 1px solid #cbd5e0; outline: none;
            font-size: 14px; cursor: pointer; background-color: white; font-family: inherit; min-width: 180px;
        }
        .filter-group select:focus { border-color: var(--primary-color); }

        /* --- BẢNG DỮ LIỆU --- */
        .table-responsive { 
            overflow-x: auto; 
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            -webkit-overflow-scrolling: touch;
        }
        
        table { width: 100%; border-collapse: collapse; background-color: white; min-width: 1100px; }
        thead { background-color: var(--primary-color); color: white; }
        th, td { padding: 10px 12px; border: 1px solid var(--border-color); text-align: center; }
        th { font-weight: 600; font-size: 13px; letter-spacing: 0.3px; }
        
        /* CSS Định dạng từng cột */
        td.text-left { text-align: left; }
        td.font-bold { font-weight: 600; }
        .col-qty { background-color: #f8fafc; }
        .col-price { color: #047857; font-weight: 600; }
        .col-total { color: #b91c1c; font-weight: bold; background-color: #fef2f2; }

        tbody tr { background-color: #ffffff; transition: background-color 0.2s ease; }
        tbody tr:nth-child(even) { background-color: #f9fafb; }
        tbody tr:hover { background-color: #f1f5f9; }

        .empty-message { text-align: center; padding: 40px; color: #718096; font-style: italic; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .top-navbar { flex-direction: column; padding: 15px; gap: 15px; }
            .nav-menu { width: 100%; justify-content: space-around; }
            .filter-section { flex-direction: column; align-items: stretch; gap: 15px; }
            .filter-group select { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER NAVBAR -->
        <div class="top-navbar">
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/khcbvadl-ai/quanlidulieu/main/logo.%20KHCB%20trong.png" alt="KHCB LOGO" class="logo-img">
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-item">Trang chủ</a>
                <a href="#" class="nav-item active">Quản lý Đặt nước</a>
            </div>
        </div>

        <h2 class="header-title"><i class="fa-solid fa-bottle-water"></i> BẢNG THỐNG KÊ ĐĂNG KÝ NƯỚC</h2>

        <!-- BỘ LỌC -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="filter-unit"><i class="fa-solid fa-filter"></i> Đơn vị:</label>
                <select id="filter-unit" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả đơn vị --</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-month"><i class="fa-solid fa-calendar-days"></i> Tháng:</label>
                <select id="filter-month" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả tháng --</option>
                </select>
            </div>
        </div>

        <!-- BẢNG HIỂN THỊ DỮ LIỆU -->
        <div class="table-responsive">
            <table id="data-table">
                <thead>
                    <tr>
                        <th rowspan="2" style="width: 50px;">STT</th>
                        <th rowspan="2" style="width: 180px;">Tên đơn vị</th>
                        <th rowspan="2" style="width: 110px;">Tháng</th>
                        <th colspan="4">Số lượng đặt (Bình/Chai)</th>
                        <th colspan="4">Thành tiền từng loại (VNĐ)</th>
                        <th rowspan="2" style="width: 120px;">Tổng tiền</th>
                    </tr>
                    <tr>
                        <th style="width: 80px;">Loại 1<br><small>(18.5L)</small></th>
                        <th style="width: 80px;">Loại 2<br><small>(19L)</small></th>
                        <th style="width: 80px;">Loại 3<br><small>(0.35L)</small></th>
                        <th style="width: 80px;">Loại 4<br><small>(0.5L)</small></th>
                        
                        <th style="width: 100px;">Tiền Loại 1</th>
                        <th style="width: 100px;">Tiền Loại 2</th>
                        <th style="width: 100px;">Tiền Loại 3</th>
                        <th style="width: 100px;">Tiền Loại 4</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <tr><td colspan="12" class="empty-message">Đang tải dữ liệu...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SHEET_ID = "1G2SbJcyAy1GYwe16cwaMmphRMaA609ow5l53aHwVw_w";
        const CACHE_KEY = "DANG_KY_NUOC_DATA_CACHE";
        
        let allData = [];
        let priceMap = {}; // Lưu đơn giá các loại bình A1, A2, A3, A4

        // Phím tắt F2 để mở nhanh Google Sheets gốc
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F2') {
                e.preventDefault();
                window.open(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`, '_blank');
            }
        });

        window.onload = function() {
            loadData();
        };

        // Hàm đọc dòng CSV xử lý trường hợp có dấu phẩy trong ngoặc kép
        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        // Tải dữ liệu song song từ 2 sheet
        function loadData() {
            // Đọc cache nếu có để hiển thị tức thì
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedData) {
                try {
                    allData = JSON.parse(cachedData);
                    populateFilters();
                    renderTable(allData);
                } catch (e) {
                    console.error("Lỗi đọc cache:", e);
                }
            }

            const urlSoLuong = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=So_luong_dat`;
            const urlThongTin = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Thong_tin_chung`;

            Promise.all([
                fetch(urlThongTin).then(res => res.text()),
                fetch(urlSoLuong).then(res => res.text())
            ])
            .then(([csvThongTin, csvSoLuong]) => {
                // 1. Phân tích Sheet Thong_tin_chung để lấy giá
                parsePriceData(csvThongTin);

                // 2. Phân tích Sheet So_luong_dat để lấy dữ liệu đăng ký và tính tiền
                parseOrderData(csvSoLuong);

                // Lưu dữ liệu vào cache LocalStorage
                localStorage.setItem(CACHE_KEY, JSON.stringify(allData));

                // Cập nhật bộ lọc và hiển thị ra bảng
                populateFilters();
                applyFilter();
            })
            .catch(err => {
                console.error("Lỗi tải dữ liệu từ Google Sheets:", err);
                if (allData.length === 0) {
                    document.getElementById('table-body').innerHTML = 
                        '<tr><td colspan="12" class="empty-message">Lỗi tải dữ liệu. Vui lòng kiểm tra quyền truy cập Sheet.</td></tr>';
                }
            });
        }

        // Tách giá từ Sheet Thong_tin_chung
        function parsePriceData(csvText) {
    let lines = csvText.split(/\r?\n/);
    priceMap = {};
    
    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        let cols = parseCSVLine(lines[i]);
        // Đổi điều kiện kiểm tra độ dài mảng để đảm bảo có đủ cột F (chỉ số 5)
        if (cols.length >= 6) { 
            let key = cols[1] ? cols[1].trim().toUpperCase() : ""; // Cột B (mã A1, A2...)
            let price = cols[5] ? parseFloat(cols[5].replace(/[^0-9.-]+/g, "")) : 0; // <-- ĐỔI THÀNH cols[5] (CỘT F)
            if (key) {
                priceMap[key] = isNaN(price) ? 0 : price;
            }
        }
    }
}

        // Tách số lượng từ Sheet So_luong_dat và tính thành tiền
        function parseOrderData(csvText) {
            let lines = csvText.split(/\r?\n/);
            allData = [];

            // Lấy giá của từng loại (A1->D, A2->E, A3->F, A4->G)
            const priceA1 = priceMap['A1'] || 0;
            const priceA2 = priceMap['A2'] || 0;
            const priceA3 = priceMap['A3'] || 0;
            const priceA4 = priceMap['A4'] || 0;

            for (let i = 1; i < lines.length; i++) { // Bỏ qua tiêu đề (dòng 0)
                if (!lines[i].trim()) continue;
                let cols = parseCSVLine(lines[i]);

                // Đảm bảo đủ các cột cơ bản B, C, D, E, F, G
                if (cols.length >= 3 && cols[1] && cols[1].trim() !== "") {
                    let donVi = cols[1].trim(); // Cột B
                    let thang = cols[2] ? cols[2].trim() : ""; // Cột C

                    let qty1 = parseInt(cols[3]) || 0; // Cột D (Loại 1)
                    let qty2 = parseInt(cols[4]) || 0; // Cột E (Loại 2)
                    let qty3 = parseInt(cols[5]) || 0; // Cột F (Loại 3)
                    let qty4 = parseInt(cols[6]) || 0; // Cột G (Loại 4)

                    // Tính tiền
                    let amount1 = qty1 * priceA1;
                    let amount2 = qty2 * priceA2;
                    let amount3 = qty3 * priceA3;
                    let amount4 = qty4 * priceA4;
                    let totalAmount = amount1 + amount2 + amount3 + amount4;

                    allData.push({
                        donVi: donVi,
                        thang: thang,
                        qty1: qty1,
                        qty2: qty2,
                        qty3: qty3,
                        qty4: qty4,
                        amount1: amount1,
                        amount2: amount2,
                        amount3: amount3,
                        amount4: amount4,
                        totalAmount: totalAmount
                    });
                }
            }
        }

        // Định dạng số tiền VNĐ (ví dụ: 150000 -> 150.000 đ)
        function formatCurrency(num) {
            if (!num || num === 0) return "0 đ";
            return num.toLocaleString('vi-VN') + " đ";
        }

        // Đổ dữ liệu vào 2 dropdown lọc
        function populateFilters() {
            const selectUnit = document.getElementById('filter-unit');
            const selectMonth = document.getElementById('filter-month');

            const currentUnit = selectUnit.value;
            const currentMonth = selectMonth.value;

            let units = new Set();
            let months = new Set();

            allData.forEach(item => {
                if (item.donVi) units.add(item.donVi);
                if (item.thang) months.add(item.thang);
            });

            // Populate Đơn vị
            selectUnit.innerHTML = '<option value="ALL">-- Tất cả đơn vị --</option>';
            Array.from(units).sort((a,b) => a.localeCompare(b, 'vi')).forEach(u => {
                selectUnit.innerHTML += `<option value="${u}">${u}</option>`;
            });

            // Populate Tháng
            selectMonth.innerHTML = '<option value="ALL">-- Tất cả tháng --</option>';
            Array.from(months).forEach(m => {
                selectMonth.innerHTML += `<option value="${m}">${m}</option>`;
            });

            selectUnit.value = currentUnit || "ALL";
            selectMonth.value = currentMonth || "ALL";
        }

        // Vẽ dữ liệu vào bảng
        function renderTable(dataArray) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="12" class="empty-message">Không tìm thấy dữ liệu nào phù hợp.</td></tr>';
                return;
            }

            dataArray.forEach((item, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="font-bold">${index + 1}</td>
                    <td class="text-left font-bold">${item.donVi}</td>
                    <td>${item.thang}</td>
                    
                    <!-- Số lượng -->
                    <td class="col-qty">${item.qty1 || '-'}</td>
                    <td class="col-qty">${item.qty2 || '-'}</td>
                    <td class="col-qty">${item.qty3 || '-'}</td>
                    <td class="col-qty">${item.qty4 || '-'}</td>
                    
                    <!-- Thành tiền -->
                    <td class="col-price">${formatCurrency(item.amount1)}</td>
                    <td class="col-price">${formatCurrency(item.amount2)}</td>
                    <td class="col-price">${formatCurrency(item.amount3)}</td>
                    <td class="col-price">${formatCurrency(item.amount4)}</td>
                    
                    <!-- Tổng tiền -->
                    <td class="col-total">${formatCurrency(item.totalAmount)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Lọc dữ liệu theo Đơn vị và Tháng
        function applyFilter() {
            let selectedUnit = document.getElementById('filter-unit').value;
            let selectedMonth = document.getElementById('filter-month').value;

            let filtered = allData.filter(item => {
                let matchUnit = (selectedUnit === "ALL" || item.donVi === selectedUnit);
                let matchMonth = (selectedMonth === "ALL" || item.thang === selectedMonth);
                return matchUnit && matchMonth;
            });

            renderTable(filtered);
        }
    </script>
</body>
</html>
