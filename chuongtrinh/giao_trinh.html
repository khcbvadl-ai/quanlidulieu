<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giáo trình</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d2e;
            --teacher-color: #0b694a;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #e2e8f0;
            --link-color: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 20px;
            font-size: 15px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* --- HEADER & NAVBAR --- */
        .top-navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--secondary-color); margin-bottom: 30px; padding: 0 10px 0 20px;
            border-radius: 8px;
        }
        .logo-box { display: flex; align-items: center; }
        .logo-img { height: 45px; object-fit: contain; margin: 10px 0; }
        .nav-menu { display: flex; list-style: none; height: 100%; }
        .nav-item {
            text-decoration: none; color: #333; padding: 22px 25px; font-weight: 500; font-size: 15px;
            transition: background-color 0.2s; border-bottom: 3px solid transparent; display: flex; align-items: center;
        }
        .nav-item:hover { background-color: #e2e8f0; }
        .nav-item.active { background-color: #ffffff; border-bottom: 3px solid #000000; font-weight: bold; }

        .header-title {
            text-align: center; color: var(--primary-color); margin-bottom: 25px;
            font-size: 22px; text-transform: uppercase; font-weight: 700;
        }

        /* --- VÙNG LỌC DỮ LIỆU --- */
        .filter-section {
            display: flex; gap: 20px; margin-bottom: 25px; background: var(--secondary-color);
            padding: 20px; border-radius: 8px; align-items: flex-end; flex-wrap: wrap;
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 250px; }
        .filter-group label { font-weight: 600; color: #4a5568; font-size: 13px; text-transform: uppercase; }
        .filter-group select {
            padding: 10px 12px; border-radius: 4px; border: 1px solid #cbd5e0; outline: none;
            font-size: 14px; width: 100%; cursor: pointer; background-color: white; font-family: inherit;
        }
        .filter-group select:focus { border-color: var(--primary-color); }

        /* --- BẢNG DỮ LIỆU --- */
        .table-responsive { 
            overflow-x: auto; 
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            -webkit-overflow-scrolling: touch;
        }
        
        table { width: 100%; border-collapse: collapse; background-color: white; min-width: 900px; }
        thead { background-color: var(--primary-color); color: white; }
        th, td { padding: 14px 15px; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; text-align: center; white-space: nowrap; }
        
        td { font-size: 14px; line-height: 1.5; }
        th:nth-child(2), td:nth-child(2) { text-align: left; }
        th:nth-child(3), td:nth-child(3) { text-align: left; }
        th:nth-child(4), td:nth-child(4) { text-align: left; }
        th:nth-child(5), td:nth-child(5) { text-align: center; }

        td:nth-child(4) { font-weight: 600; color: var(--teacher-color); }

        /* Nút và Badge cho phần Link/Minh chứng */
        .btn-evidence {
            display: inline-block; padding: 6px 12px; background-color: #e0f2fe; color: var(--link-color);
            border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 13px;
            border: 1px solid #bae6fd; transition: all 0.2s; white-space: nowrap;
        }
        .btn-evidence:hover { background-color: #bae6fd; color: #1d4ed8; }
        
        .badge-missing {
            display: inline-block; padding: 6px 12px; background-color: #fee2e2; color: #991b1b;
            border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid #fecaca; white-space: nowrap;
        }

        @media (max-width: 768px) {
            th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; background-color: inherit; z-index: 2; border-right: 1px solid #e2e8f0; }
            th:nth-child(1) { background-color: var(--primary-color); color: white; border-right: none;}
        }

        tbody tr { background-color: #ffffff; transition: background-color 0.2s ease; }
        tbody tr:nth-child(even) { background-color: #fbfbfb; }
        tbody tr:hover { background-color: #f1f5f9; }

        .empty-message { text-align: center; padding: 40px; color: #718096; font-style: italic; }

        /* --- MOBILE TWEAKS --- */
        @media (max-width: 768px) {
            .top-navbar { flex-direction: column; padding: 15px; gap: 15px; }
            .nav-menu { width: 100%; justify-content: space-around; }
            .nav-item { padding: 10px; font-size: 14px; }
            .filter-section { flex-direction: column; align-items: stretch; gap: 15px; padding: 15px; }
            .filter-group { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER NAVBAR -->
        <div class="top-navbar">
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/khcbvadl-ai/quanlidulieu/main/logo.%20KHCB%20trong.png" alt="KHCB LOGO" class="logo-img">
            </div>
            <div class="nav-menu">
                <a href="index.html" class="nav-item">Trang chủ</a>
                <a href="#" class="nav-item active">Dữ liệu Khoa</a>
            </div>
        </div>

        <h2 class="header-title"><i class="fa-solid fa-list-check"></i> GIÁO TRÌNH</h2>

        <!-- BỘ LỌC -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="filter-year"><i class="fa-regular fa-calendar-days"></i> Chọn năm học (Tab dữ liệu):</label>
                <select id="filter-year" onchange="changeYear()"></select>
            </div>
            <div class="filter-group">
                <label id="label-filter-col4" for="filter-col4"><i class="fa-solid fa-filter"></i> Lọc dữ liệu:</label>
                <select id="filter-col4" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả --</option>
                </select>
            </div>
        </div>

        <!-- BẢNG HIỂN THỊ DỮ LIỆU -->
        <div class="table-responsive">
            <table id="data-table">
                <thead>
                    <tr>
                        <th style="width: 60px;" id="header-col1">Cột A</th>
                        <th style="width: 120px;" id="header-col2">Cột B</th>
                        <th id="header-col3">Cột C</th>
                        <th style="width: 300px;" id="header-col4">Cột D</th>
                        <th style="width: 150px;" id="header-col5">Cột E</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu từ Sheet sẽ được vẽ vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // CẬP NHẬT SHEET_ID MỚI
        const SHEET_ID = "1lHh_ksG9Dik_zVPabGKuvk1hrJJwsCXyWoJIUL8d73A";
        
        // ĐỔI CACHE KEY ĐỂ DỰ DỮ LIỆU CŨ KHÔNG BỊ TRỘN LẪN
        const CONFIG_CACHE_KEY = "GIAO_TRINH_CONFIG_YEARS_V2";
        let currentYear = ""; 
        let allData = [];
        let tableHeaders = [];

        // LẮNG NGHE SỰ KIỆN BẤM PHÍM F2 ĐỂ HIỆN NÚT TRUY CẬP
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F2') {
                e.preventDefault();
                
                if (!document.getElementById('api-redirect-btn')) {
                    const apiBtn = document.createElement('a');
                    apiBtn.id = 'api-redirect-btn';
                    
                    apiBtn.href = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
                    apiBtn.target = '_blank';
                    
                    apiBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Truy cập';
                    
                    apiBtn.style.display = 'inline-block';
                    apiBtn.style.margin = '25px auto 10px auto';
                    apiBtn.style.padding = '12px 28px';
                    apiBtn.style.backgroundColor = '#2563eb';
                    apiBtn.style.color = '#ffffff';
                    apiBtn.style.textDecoration = 'none';
                    apiBtn.style.borderRadius = '6px';
                    apiBtn.style.fontWeight = 'bold';
                    apiBtn.style.fontSize = '14px';
                    apiBtn.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';
                    apiBtn.style.transition = 'all 0.2s ease';

                    const btnWrapper = document.createElement('div');
                    btnWrapper.style.textAlign = 'center';
                    btnWrapper.appendChild(apiBtn);

                    document.querySelector('.container').appendChild(btnWrapper);
                    btnWrapper.scrollIntoView({ behavior: 'smooth' });
                }
            }
        });

        window.onload = function() {
            loadConfigAndInit();
        };

        // Hàm đọc CSV an toàn
        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        // TẢI DANH SÁCH TỪ TAB CONFIG
        function loadConfigAndInit() {
            const cachedYearsString = localStorage.getItem(CONFIG_CACHE_KEY);
            let cachedYears = [];

            if (cachedYearsString) {
                try {
                    cachedYears = JSON.parse(cachedYearsString);
                    if (cachedYears.length > 0) {
                        populateYearDropdown(cachedYears);
                        currentYear = cachedYears[0];
                        document.getElementById('filter-year').value = currentYear;
                        loadDataForYear(currentYear);
                    }
                } catch (e) {
                    console.error("Lỗi đọc cache Config:", e);
                }
            }

            const configUrl = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Config`;
            
            fetch(configUrl)
                .then(res => {
                    if (!res.ok) throw new Error("Không thể kết nối đến Google Sheet");
                    return res.text();
                })
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let years = [];
                    for(let i = 0; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        let cols = parseCSVLine(lines[i]);
                        let y = cols[0] ? cols[0].trim() : "";
                        if(y && y.toLowerCase() !== "năm học" && y.toLowerCase() !== "config") {
                            years.push(y);
                        }
                    }
                    
                    if(years.length > 0) {
                        const newYearsString = JSON.stringify(years);
                        if (newYearsString !== cachedYearsString) {
                            localStorage.setItem(CONFIG_CACHE_KEY, newYearsString);
                            populateYearDropdown(years);
                            
                            if (!currentYear || !years.includes(currentYear)) {
                                currentYear = years[0];
                                document.getElementById('filter-year').value = currentYear;
                                loadDataForYear(currentYear);
                            }
                        }
                    }
                })
                .catch(err => {
                    console.error("Lỗi tải tab Config:", err);
                });
        }

        function populateYearDropdown(years) {
            const select = document.getElementById('filter-year');
            const selectedVal = select.value;
            select.innerHTML = '';
            years.forEach(y => {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = "Dữ liệu năm " + y;
                select.appendChild(opt);
            });
            if (selectedVal && years.includes(selectedVal)) {
                select.value = selectedVal;
            }
        }

        function changeYear() {
            currentYear = document.getElementById('filter-year').value;
            document.getElementById('filter-col4').innerHTML = '<option value="ALL">-- Tất cả --</option>'; 
            loadDataForYear(currentYear);
        }

        // TẢI DỮ LIỆU THEO NĂM
        function loadDataForYear(year) {
            // ĐỔI CACHE KEY TƯƠNG ỨNG MỖI NĂM
            const CACHE_KEY = "GIAO_TRINH_DATA_V2_" + year;
            const cachedDataString = localStorage.getItem(CACHE_KEY);
            const cachedHeadersString = localStorage.getItem(CACHE_KEY + "_HEADERS");

            if (cachedDataString && cachedHeadersString) {
                try {
                    allData = JSON.parse(cachedDataString);
                    tableHeaders = JSON.parse(cachedHeadersString);
                    
                    renderHeaders(tableHeaders);
                    populateFilterDropdown();
                    applyFilter();
                } catch (e) {
                    console.error("Lỗi đọc cache năm " + year + ":", e);
                }
            }

            const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(year)}`;

            fetch(CSV_URL)
                .then(response => {
                    if (!response.ok) throw new Error("Lỗi tải trang dữ liệu " + year);
                    return response.text();
                })
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let rawData = [];
                    let newHeaders = [];
                    let isFirstRow = true;
                    
                    for (let i = 0; i < lines.length; i++) { 
                        if (!lines[i].trim()) continue;
                        let cols = parseCSVLine(lines[i]);
                        
                        if (isFirstRow) {
                            newHeaders = [
                                cols[0] ? cols[0].trim() : "CỘT A",
                                cols[1] ? cols[1].trim() : "CỘT B",
                                cols[2] ? cols[2].trim() : "CỘT C",
                                cols[3] ? cols[3].trim() : "CỘT D",
                                cols[4] ? cols[4].trim() : "CỘT E"
                            ];
                            isFirstRow = false;
                            continue;
                        }

                        if (cols[0] && cols[0].trim() !== "") {
                            rawData.push({
                                col1: cols[0].trim(),
                                col2: (cols.length > 1 && cols[1]) ? cols[1].trim() : "",
                                col3: (cols.length > 2 && cols[2]) ? cols[2].trim() : "",
                                col4: (cols.length > 3 && cols[3]) ? cols[3].trim() : "",
                                col5: (cols.length > 4 && cols[4]) ? cols[4].trim() : ""
                            });
                        }
                    }

                    const newDataString = JSON.stringify(rawData);
                    const newHeadersString = JSON.stringify(newHeaders);
                    
                    if (newDataString !== cachedDataString || newHeadersString !== cachedHeadersString) {
                        localStorage.setItem(CACHE_KEY, newDataString);
                        localStorage.setItem(CACHE_KEY + "_HEADERS", newHeadersString);
                        
                        allData = rawData;
                        tableHeaders = newHeaders;
                        
                        renderHeaders(tableHeaders);
                        populateFilterDropdown();
                        applyFilter();
                    }
                })
                .catch(err => {
                    console.error("Lỗi đồng bộ dữ liệu năm " + year + ":", err);
                });
        }

        function renderHeaders(headers) {
            document.getElementById('header-col1').textContent = headers[0];
            document.getElementById('header-col2').textContent = headers[1];
            document.getElementById('header-col3').textContent = headers[2];
            document.getElementById('header-col4').textContent = headers[3];
            document.getElementById('header-col5').textContent = headers[4];

            document.getElementById('label-filter-col4').innerHTML = `<i class="fa-solid fa-filter"></i> Lọc theo ${headers[3]}:`;
        }

        function populateFilterDropdown() {
            const select = document.getElementById('filter-col4');
            const currentSelected = select.value;
            
            select.innerHTML = '<option value="ALL">-- Tất cả --</option>';
            
            let items = new Set();
            
            allData.forEach(item => {
                if (item.col4) {
                    let parts = item.col4.split(',');
                    parts.forEach(part => {
                        let t = part.trim();
                        if (t && t !== "") items.add(t);
                    });
                }
            });

            Array.from(items).sort((a,b) => a.localeCompare(b, 'vi')).forEach(t => {
                let option = document.createElement('option');
                option.value = t;
                option.textContent = t;
                select.appendChild(option);
            });

            let matchFound = false;
            for(let i = 0; i < select.options.length; i++){
                if(select.options[i].value === currentSelected){
                    matchFound = true; break;
                }
            }
            if(matchFound) select.value = currentSelected;
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-message">Không tìm thấy dữ liệu nào phù hợp.</td></tr>';
                return;
            }

            dataArray.forEach(item => {
                let linkHTML = '';
                if (item.col5 && item.col5 !== "") {
                    let url = item.col5.startsWith('http') ? item.col5 : 'https://' + item.col5;
                    linkHTML = `<a href="${url}" target="_blank" class="btn-evidence"><i class="fa-solid fa-link"></i> Mở link</a>`;
                } else {
                    linkHTML = `<span class="badge-missing">Chưa có</span>`;
                }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; text-align: center;">${item.col1}</td>
                    <td>${item.col2}</td>
                    <td>${item.col3}</td>
                    <td>${item.col4}</td>
                    <td style="text-align: center;">${linkHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilter() {
            let selectedVal = document.getElementById('filter-col4').value;

            let filteredData = allData.filter(item => {
                if (selectedVal === "ALL") return true;
                return item.col4 && item.col4.includes(selectedVal);
            });

            renderTable(filteredData);
        }
    </script>
</body>
</html>
