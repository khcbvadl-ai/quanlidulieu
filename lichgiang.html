<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Giảng Dạy Khoa</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d2e;
            --teacher-color: #0b694a;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 20px;
            font-size: 15px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* --- HEADER & NAVBAR --- */
        .top-navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--secondary-color);
            margin-bottom: 30px;
            padding: 0 10px 0 20px;
        }

        .logo-box {
            display: flex;
            align-items: center;
        }

        .logo-img {
            height: 45px;
            object-fit: contain;
            margin: 10px 0;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            height: 100%;
        }

        .nav-item {
            text-decoration: none;
            color: #333;
            padding: 22px 25px;
            font-weight: 500;
            font-size: 15px;
            transition: background-color 0.2s;
            border-bottom: 3px solid transparent;
            display: flex;
            align-items: center;
        }

        .nav-item:hover {
            background-color: #e2e8f0;
        }

        /* Trạng thái được chọn (Active) */
        .nav-item.active {
            background-color: #ffffff;
            border-bottom: 3px solid #000000;
            font-weight: bold;
        }

        .header-title {
            text-align: center;
            color: var(--primary-color);
            margin-bottom: 25px;
            font-size: 22px;
            text-transform: uppercase;
            font-weight: 700;
        }

        /* --- VÙNG LỌC DỮ LIỆU --- */
        .filter-section {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
            background: var(--secondary-color);
            padding: 15px 25px;
            border-radius: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .filter-group label {
            font-weight: 500;
            color: #4a5568;
            font-size: 14px;
        }

        .filter-group select {
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #cbd5e0;
            outline: none;
            font-size: 14px;
            min-width: 130px;
            cursor: pointer;
            background-color: white;
        }

        .filter-group select:focus {
            border-color: var(--primary-color);
        }

        /* --- BẢNG DỮ LIỆU --- */
        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        thead {
            background-color: var(--primary-color);
            color: white;
        }

        th, td {
            padding: 14px 15px;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-align: center;
        }

        /* Căn chỉnh cột riêng biệt giống thiết kế */
        th:nth-child(2), td:nth-child(2) {
            text-align: left; /* Cột Giảng viên căn trái */
        }

        tbody tr {
            background-color: #ffffff;
            transition: background-color 0.2s ease;
        }

        tbody tr:nth-child(even) {
            background-color: #fbfbfb; /* Màu xám rất nhạt cho hàng chẵn */
        }

        tbody tr:hover {
            background-color: #f1f5f9;
        }

        .empty-message {
            text-align: center;
            padding: 30px;
            color: #718096;
            font-style: italic;
        }

        #loading {
            text-align: center;
            padding: 20px;
            color: var(--primary-color);
            font-weight: bold;
            font-size: 16px;
            display: none;
        }
        
        #sync-indicator {
            text-align: center;
            font-size: 12px;
            color: #718096;
            margin-top: 20px;
            font-style: italic;
        }

        @media (max-width: 768px) {
            .top-navbar {
                flex-direction: column;
                padding: 15px;
                gap: 15px;
            }
            .nav-menu {
                width: 100%;
                justify-content: space-around;
            }
            .nav-item {
                padding: 10px;
                font-size: 14px;
            }
            .filter-section {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-group {
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER NAVBAR -->
        <div class="top-navbar">
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/khcbvadl-ai/quanlidulieu/main/logo.%20KHCB%20trong.png" alt="KHCB LOGO" class="logo-img">
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item">Trang chủ</a>
                <!-- Mục Lịch giảng đang được chọn (Active) theo yêu cầu của bạn -->
                <a href="#" class="nav-item active">Lịch giảng</a>
                <a href="#" class="nav-item">Video bài giảng</a>
            </div>
        </div>

        <h2 class="header-title"><i class="fa-solid fa-calendar-days"></i> LỊCH GIẢNG DẠY TOÀN KHOA</h2>

        <!-- BỘ LỌC -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="filter-day"><i class="fa-solid fa-filter"></i> Chọn Thứ:</label>
                <select id="filter-day" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả --</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-shift"><i class="fa-regular fa-clock"></i> Chọn Ca:</label>
                <select id="filter-shift" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả --</option>
                </select>
            </div>
        </div>

        <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu...</div>

        <!-- BẢNG HIỂN THỊ LỊCH -->
        <div class="table-responsive">
            <table id="schedule-table" style="display: none;">
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>GIẢNG VIÊN</th>
                        <th>THỨ</th>
                        <th>CA</th>
                        <th>LỚP</th>
                        <th>PHÒNG</th>
                        <th>THỜI GIAN</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu từ Sheet sẽ được vẽ vào đây -->
                </tbody>
            </table>
        </div>
        
        <div id="sync-indicator"></div>
    </div>

    <script>
        // Cấu hình
        const SHEET_ID = "1yyBsezsZlOYwGfAfavDvptB-KEiWo2gZu9Go3PE8zRU";
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv`;
        const CACHE_KEY = "SCHEDULE_DATA_CACHE_V2";

        let allScheduleData = [];

        window.onload = function() {
            const cachedDataString = localStorage.getItem(CACHE_KEY);
            let hasCache = false;

            if (cachedDataString) {
                try {
                    allScheduleData = JSON.parse(cachedDataString);
                    hasCache = true;
                    
                    document.getElementById('schedule-table').style.display = 'table';
                    populateFilterDropdowns();
                    applyFilter();
                    
                    document.getElementById('sync-indicator').innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Đang kiểm tra lịch mới...';
                } catch (e) {
                    console.error("Lỗi đọc cache:", e);
                }
            }

            fetchDataFromSheet(hasCache);
        };

        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        function fetchDataFromSheet(isBackgroundSync) {
            if (!isBackgroundSync) {
                document.getElementById('loading').style.display = 'block';
            }

            fetch(CSV_URL)
                .then(response => response.text())
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let rawData = [];
                    
                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        let cols = parseCSVLine(lines[i]);
                        
                        if (cols.length >= 7) {
                            rawData.push({
                                stt: cols[0].trim(),
                                teacher: cols[1].trim(),
                                day: parseInt(cols[2].trim()) || 99, 
                                shift: parseInt(cols[3].trim()) || 99,
                                className: cols[4].trim(),
                                room: cols[5].trim(),
                                time: cols[6].trim()
                            });
                        }
                    }

                    // Sắp xếp Thứ -> Ca -> Giảng viên
                    rawData.sort((a, b) => {
                        if (a.day !== b.day) return a.day - b.day;
                        if (a.shift !== b.shift) return a.shift - b.shift;
                        return a.teacher.localeCompare(b.teacher, 'vi');
                    });

                    const newDataString = JSON.stringify(rawData);
                    const oldDataString = localStorage.getItem(CACHE_KEY);

                    if (newDataString !== oldDataString) {
                        localStorage.setItem(CACHE_KEY, newDataString);
                        allScheduleData = rawData;
                        
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('schedule-table').style.display = 'table';
                        
                        let currentDay = document.getElementById('filter-day').value;
                        let currentShift = document.getElementById('filter-shift').value;
                        
                        populateFilterDropdowns();
                        
                        document.getElementById('filter-day').value = currentDay || "ALL";
                        document.getElementById('filter-shift').value = currentShift || "ALL";
                        
                        applyFilter();
                    } else if (!isBackgroundSync) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('schedule-table').style.display = 'table';
                    }
                    
                    document.getElementById('sync-indicator').innerHTML = '<i class="fa-solid fa-check-circle" style="color: green;"></i> Dữ liệu lịch giảng đã được đồng bộ';
                })
                .catch(err => {
                    console.error("Lỗi đồng bộ dữ liệu:", err);
                    if (!isBackgroundSync) {
                        document.getElementById('loading').innerHTML = '<span style="color:red">Lỗi tải dữ liệu. Vui lòng kiểm tra lại kết nối mạng hoặc Google Sheet.</span>';
                    }
                    document.getElementById('sync-indicator').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: orange;"></i> Đang sử dụng dữ liệu cũ (Ngoại tuyến)';
                });
        }

        function populateFilterDropdowns() {
            const daySelect = document.getElementById('filter-day');
            const shiftSelect = document.getElementById('filter-shift');
            
            daySelect.innerHTML = '<option value="ALL">-- Tất cả --</option>';
            shiftSelect.innerHTML = '<option value="ALL">-- Tất cả --</option>';
            
            let days = new Set();
            let shifts = new Set();

            allScheduleData.forEach(item => {
                if (item.day !== 99) days.add(item.day);
                if (item.shift !== 99) shifts.add(item.shift);
            });

            Array.from(days).sort((a,b)=>a-b).forEach(d => {
                let option = document.createElement('option');
                option.value = d;
                option.textContent = "Thứ " + d;
                daySelect.appendChild(option);
            });

            Array.from(shifts).sort((a,b)=>a-b).forEach(s => {
                let option = document.createElement('option');
                option.value = s;
                option.textContent = "Ca " + s;
                shiftSelect.appendChild(option);
            });
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" class="empty-message">Không tìm thấy lịch giảng dạy phù hợp</td></tr>';
                return;
            }

            dataArray.forEach((item, index) => {
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; text-align: center;">${index + 1}</td>
                    <td style="font-weight: bold; color: var(--teacher-color);">${item.teacher}</td>
                    <td style="text-align: center;">${item.day}</td>
                    <td style="text-align: center;">${item.shift}</td>
                    <td style="text-align: center;">${item.className}</td>
                    <td style="font-weight: bold; text-align: center;">${item.room}</td>
                    <td style="font-size: 13px; text-align: center; color: #555;">${item.time}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilter() {
            let selectedDay = document.getElementById('filter-day').value;
            let selectedShift = document.getElementById('filter-shift').value;

            let filteredData = allScheduleData.filter(item => {
                let matchDay = (selectedDay === "ALL") || (item.day.toString() === selectedDay);
                let matchShift = (selectedShift === "ALL") || (item.shift.toString() === selectedShift);
                return matchDay && matchShift;
            });

            renderTable(filteredData);
        }
    </script>
</body>
</html>
