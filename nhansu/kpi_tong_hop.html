<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân công KPI Tổng Hợp Chi Tiết</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d2e;
            --teacher-color: #0b694a;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #e2e8f0;
            --link-color: #2563eb;
            --child-bg: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 20px;
            font-size: 14px;
        }

        .container { max-width: 1400px; margin: 0 auto; }

        /* --- HEADER & NAVBAR --- */
        .top-navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--secondary-color); margin-bottom: 25px; padding: 0 10px 0 20px;
            border-radius: 8px;
        }
        .logo-box { display: flex; align-items: center; }
        .logo-img { height: 45px; object-fit: contain; margin: 10px 0; }
        .nav-menu { display: flex; list-style: none; height: 100%; }
        .nav-item {
            text-decoration: none; color: #333; padding: 20px 22px; font-weight: 500; font-size: 15px;
            transition: background-color 0.2s; border-bottom: 3px solid transparent; display: flex; align-items: center;
        }
        .nav-item:hover { background-color: #e2e8f0; }
        .nav-item.active { background-color: #ffffff; border-bottom: 3px solid #000000; font-weight: bold; }

        .header-title {
            text-align: center; color: var(--primary-color); margin-bottom: 20px;
            font-size: 22px; text-transform: uppercase; font-weight: 700;
        }

        /* --- VÙNG LỌC DỮ LIỆU --- */
        .filter-section {
            display: flex; gap: 20px; margin-bottom: 20px; background: var(--secondary-color);
            padding: 18px 20px; border-radius: 8px; align-items: flex-end; flex-wrap: wrap;
        }
        .filter-group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 250px; }
        .filter-group label { font-weight: 600; color: #4a5568; font-size: 13px; text-transform: uppercase; }
        .filter-group select {
            padding: 10px 12px; border-radius: 4px; border: 1px solid #cbd5e0; outline: none;
            font-size: 14px; width: 100%; cursor: pointer; background-color: white; font-family: inherit;
        }
        .filter-group select:focus { border-color: var(--primary-color); }

        /* --- BẢNG DỮ LIỆU --- */
        .table-responsive { 
            overflow-x: auto; 
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            -webkit-overflow-scrolling: touch;
        }
        
        table { width: 100%; border-collapse: collapse; background-color: white; min-width: 1100px; }
        thead { background-color: var(--primary-color); color: white; }
        th, td { padding: 12px 14px; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; text-align: center; white-space: nowrap; }
        
        /* Master Row Styling */
        tr.master-row { background-color: #ffffff; cursor: pointer; font-weight: 600; transition: background-color 0.2s;}
        tr.master-row:hover { background-color: #f1f5f9; }
        
        /* Child Row Styling */
        tr.child-row { background-color: var(--child-bg); display: none; }
        tr.child-row:hover { background-color: #edf2f7; }
        
        .btn-toggle {
            background: none; border: none; color: var(--primary-color);
            font-size: 14px; cursor: pointer; width: 24px; height: 24px;
            display: inline-flex; align-items: center; justify-content: center;
            border-radius: 4px; transition: background 0.2s; margin-right: 8px; pointer-events: none;
        }
        .master-row:hover .btn-toggle { background-color: #cbd5e1; }

        .person-tag {
            display: inline-block; padding: 4px 10px; background-color: #e2e8f0; color: var(--teacher-color);
            border-radius: 12px; font-size: 12px; font-weight: 600; margin: 3px; border: 1px solid #cbd5e1;
        }

        /* Nút và Badge cho phần Link/Minh chứng */
        .btn-evidence {
            display: inline-block; padding: 5px 10px; background-color: #e0f2fe; color: var(--link-color);
            border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 12px;
            border: 1px solid #bae6fd; transition: all 0.2s; white-space: nowrap;
        }
        .btn-evidence:hover { background-color: #bae6fd; color: #1d4ed8; }
        
        .badge-missing {
            display: inline-block; padding: 4px 8px; background-color: #fee2e2; color: #991b1b;
            border-radius: 12px; font-size: 12px; font-weight: 600; border: 1px solid #fecaca; white-space: nowrap;
        }

        .empty-message { text-align: center; padding: 40px; color: #718096; font-style: italic; }
        #loading { text-align: center; padding: 30px; color: var(--primary-color); font-weight: bold; font-size: 16px; display: none; }
        .progress-text { font-size: 13px; font-weight: normal; color: #64748b; margin-top: 8px; display: block;}

        .source-badge {
            color: #d97706; font-size: 11px; font-weight: bold; background: #fef3c7; 
            padding: 2px 6px; border-radius: 4px; border: 1px solid #fde68a; margin-right: 6px;
        }

        @media (max-width: 768px) {
            .top-navbar { flex-direction: column; padding: 15px; gap: 15px; }
            .nav-menu { width: 100%; justify-content: space-around; }
            .nav-item { padding: 10px; font-size: 14px; }
            .filter-section { flex-direction: column; align-items: stretch; gap: 15px; padding: 15px; }
            .filter-group { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER NAVBAR -->
        <div class="top-navbar">
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/khcbvadl-ai/quanlidulieu/main/logo.%20KHCB%20trong.png" alt="KHCB LOGO" class="logo-img">
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item">Trang chủ</a>
                <a href="#" class="nav-item">Lịch giảng</a>
                <a href="#" class="nav-item active">Dữ liệu Khoa</a>
            </div>
        </div>

        <h2 class="header-title"><i class="fa-solid fa-sitemap"></i> HỆ THỐNG PHÂN CÔNG KPI CHI TIẾT</h2>

        <!-- BỘ LỌC -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="filter-year"><i class="fa-regular fa-calendar-days"></i> Chọn năm học (Kế hoạch):</label>
                <select id="filter-year" onchange="changeYear()">
                </select>
            </div>
            <div class="filter-group">
                <label id="label-filter-person" for="filter-person"><i class="fa-solid fa-user-check"></i> Lọc theo giảng viên:</label>
                <select id="filter-person" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả giảng viên --</option>
                </select>
            </div>
        </div>

        <div id="loading">
            <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
            <div style="margin-top: 10px;">Đang tải và tổng hợp dữ liệu...</div>
            <span class="progress-text" id="loading-progress">Đang kết nối đến hệ thống...</span>
        </div>

        <!-- BẢNG HIỂN THỊ DỮ LIỆU TREE-TABLE -->
        <div class="table-responsive">
            <table id="data-table">
                <thead>
                    <tr>
                        <th style="width: 500px;">Nội dung KPI (Đầu việc)</th>
                        <th style="width: 250px;">Người thực hiện</th>
                        <th style="width: 200px;">Minh chứng yêu cầu</th>
                        <th style="width: 150px;">Link minh chứng</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu dạng Tree-table sẽ được vẽ vào đây -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // CÁC THÔNG SỐ CẤU HÌNH API
        const MASTER_API_ID = "1n5HmlBHAjtQTKyHrjfeag6wOiwhl-4Yf";
        const DETAIL_API_ID = "1c1rrnXfz6f82xSuPbcngOONR4Ted41Fe";
        
        let currentYear = ""; 
        let allData = []; 

        // KHÓA PHÍM F2 MỞ LINK ĐẾN FILE SPREADSHEET DETAIL
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F2') {
                e.preventDefault();
                if (!document.getElementById('api-redirect-btn')) {
                    const apiBtn = document.createElement('a');
                    apiBtn.id = 'api-redirect-btn';
                    apiBtn.href = `https://docs.google.com/spreadsheets/d/${DETAIL_API_ID}/edit?gid=212029541#gid=212029541`;
                    apiBtn.target = '_blank';
                    apiBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Truy cập File Kế hoạch chi tiết';
                    
                    apiBtn.style.display = 'inline-block';
                    apiBtn.style.margin = '25px auto 10px auto';
                    apiBtn.style.padding = '12px 28px';
                    apiBtn.style.backgroundColor = '#2563eb';
                    apiBtn.style.color = '#ffffff';
                    apiBtn.style.textDecoration = 'none';
                    apiBtn.style.borderRadius = '6px';
                    apiBtn.style.fontWeight = 'bold';
                    apiBtn.style.fontSize = '14px';
                    apiBtn.style.boxShadow = '0 4px 6px -1px rgba(0, 0, 0, 0.1)';
                    apiBtn.style.transition = 'all 0.2s ease';

                    const btnWrapper = document.createElement('div');
                    btnWrapper.style.textAlign = 'center';
                    btnWrapper.appendChild(apiBtn);

                    document.querySelector('.container').appendChild(btnWrapper);
                    btnWrapper.scrollIntoView({ behavior: 'smooth' });
                }
            }
        });

        window.onload = function() {
            loadConfigAndInit();
        };

        // Hàm đọc CSV an toàn
        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        // 1. TẢI CONFIG NĂM HỌC
        function loadConfigAndInit() {
            const configUrl = `https://docs.google.com/spreadsheets/d/${MASTER_API_ID}/gviz/tq?tqx=out:csv&sheet=Config`;
            
            fetch(configUrl)
                .then(res => res.text())
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let years = [];
                    for(let i = 0; i < lines.length; i++) {
                        let cols = parseCSVLine(lines[i]);
                        let y = cols[0] ? cols[0].trim() : "";
                        if(y && y.toLowerCase() !== "năm học" && y.toLowerCase() !== "config") {
                            years.push(y);
                        }
                    }
                    
                    if(years.length > 0) {
                        populateYearDropdown(years);
                        currentYear = years[0];
                        document.getElementById('filter-year').value = currentYear;
                        loadAndMergeData(currentYear); // Bắt đầu tổng hợp dữ liệu
                    }
                })
                .catch(err => {
                    console.error("Lỗi Config Master:", err);
                    document.getElementById('loading').innerHTML = `<span style="color:red">Lỗi tải cấu hình ban đầu.</span>`;
                });
        }

        function populateYearDropdown(years) {
            const select = document.getElementById('filter-year');
            select.innerHTML = '';
            years.forEach(y => {
                let opt = document.createElement('option');
                opt.value = y;
                opt.textContent = "Kế hoạch năm " + y;
                select.appendChild(opt);
            });
        }

        function changeYear() {
            currentYear = document.getElementById('filter-year').value;
            document.getElementById('filter-person').innerHTML = '<option value="ALL">-- Tất cả giảng viên --</option>'; 
            loadAndMergeData(currentYear);
        }

        // 2. ĐỌC TÊN SHEET & TÊN GIẢNG VIÊN - ĐÃ CHẶN CÁC TỪ KHÓA LỖI ("Tên đầy đủ")
        async function fetchStaffConfig() {
            try {
                const detailConfigUrl = `https://docs.google.com/spreadsheets/d/${DETAIL_API_ID}/gviz/tq?tqx=out:csv&sheet=Config`;
                const res = await fetch(detailConfigUrl);
                const text = await res.text();
                let lines = text.split(/\r?\n/);
                let staffList = [];
                
                // Mảng các từ khóa rác ở dòng tiêu đề cần loại bỏ
                const excludedWords = ["danh sách", "tên đầy đủ", "họ và tên", "tên", "nhân sự", "stt", "mã gv", "giảng viên", "sheet name", "tên sheet"];

                for (let i = 0; i < lines.length; i++) {
                    if (!lines[i].trim()) continue;
                    let cols = parseCSVLine(lines[i]);
                    let sheetName = cols[0] ? cols[0].trim() : "";
                    let teacherName = cols[1] ? cols[1].trim() : sheetName;

                    if (sheetName) {
                        let lowerA = sheetName.toLowerCase();
                        let lowerB = teacherName.toLowerCase();
                        
                        // Nếu dòng này KHÔNG chứa các từ khóa rác thì mới thêm vào danh sách
                        if (!excludedWords.includes(lowerA) && !excludedWords.includes(lowerB)) {
                            staffList.push({
                                sheetName: sheetName,
                                teacherName: teacherName || sheetName
                            });
                        }
                    }
                }
                return staffList;
            } catch (e) {
                console.error("Lỗi đọc danh sách giảng viên từ Config:", e);
                return [];
            }
        }

        // 3. THUẬT TOÁN ĐỌC VÀ GỘP DỮ LIỆU ĐỘNG TỪ CÁC SHEET CÁ NHÂN
        async function loadAndMergeData(year) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('table-body').innerHTML = '';
            const progressText = document.getElementById('loading-progress');
            
            try {
                // Lấy danh sách giảng viên chuẩn
                progressText.innerText = "Đang lấy danh sách giảng viên...";
                const staffList = await fetchStaffConfig();

                let kpiMap = {}; // Dictionary để gộp nhóm các đầu việc

                progressText.innerText = `Đang tổng hợp nhiệm vụ từ ${staffList.length} giảng viên...`;
                
                let fetchPromises = staffList.map(async (staff) => {
                    try {
                        let detailUrl = `https://docs.google.com/spreadsheets/d/${DETAIL_API_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(staff.sheetName)}`;
                        let detailRes = await fetch(detailUrl);
                        let detailCsv = await detailRes.text();
                        let detailLines = detailCsv.split(/\r?\n/);

                        for (let r = 1; r < detailLines.length; r++) { // Bỏ qua dòng tiêu đề
                            if (!detailLines[r].trim()) continue;
                            let cols = parseCSVLine(detailLines[r]);
                            
                            let maNguon = cols.length > 1 && cols[1] ? cols[1].trim() : ""; // VD: KHCB-DL.1
                            let dauViec = cols.length > 2 && cols[2] ? cols[2].trim() : ""; // VD: DL1.03 - Xây dựng...
                            
                            // Chỉ xử lý nếu có đầu việc và không phải dòng tiêu đề
                            if (dauViec && dauViec.toLowerCase() !== "mã kpi/nội dung kpi khoa" && dauViec.toLowerCase() !== "mã kpi") {
                                
                                // Dùng chính tên Đầu việc (Cột C) làm Khóa (Key) để gộp nhóm
                                let groupKey = dauViec;

                                if (!kpiMap[groupKey]) {
                                    // Khởi tạo nhóm mới nếu chưa tồn tại
                                    kpiMap[groupKey] = {
                                        id: 'kpi_' + Math.random().toString(36).substring(2, 10), // ID ngẫu nhiên an toàn cho HTML
                                        maNguon: maNguon,
                                        dauViec: dauViec,
                                        teachersSet: new Set(),
                                        tasks: []
                                    };
                                }

                                let chiTietNhiemVu = cols.length > 3 && cols[3] ? cols[3].trim() : "";
                                let minhChungText = cols.length > 8 && cols[8] ? cols[8].trim() : "";
                                let linkText = cols.length > 9 && cols[9] ? cols[9].trim() : "";

                                // Tự sửa lỗi nếu người dùng dán link vào nhầm cột Minh chứng chữ
                                if (!linkText && (minhChungText.startsWith('http://') || minhChungText.startsWith('https://'))) {
                                    linkText = minhChungText;
                                    minhChungText = "Minh chứng trực tuyến";
                                }

                                // Thêm nhiệm vụ của người này vào danh sách của nhóm
                                if (chiTietNhiemVu || minhChungText || linkText) {
                                    kpiMap[groupKey].tasks.push({
                                        chiTiet: chiTietNhiemVu,
                                        teacherName: staff.teacherName,
                                        minhChungText: minhChungText,
                                        linkText: linkText
                                    });
                                    kpiMap[groupKey].teachersSet.add(staff.teacherName);
                                }
                            }
                        }
                    } catch (e) {
                        console.warn(`Lỗi tải sheet cá nhân: ${staff.sheetName}`, e);
                    }
                });

                // Đợi load xong toàn bộ file của tất cả cá nhân
                await Promise.all(fetchPromises);

                // Chuyển Map thành mảng để render
                allData = Object.values(kpiMap);

                document.getElementById('loading').style.display = 'none';

                populateFilterDropdown();
                applyFilter();

            } catch (err) {
                console.error("Lỗi tổng hợp:", err);
                document.getElementById('loading').innerHTML = `<span style="color:red">Đã xảy ra lỗi khi tải dữ liệu! Vui lòng thử lại.</span>`;
            }
        }

        // 4. BỘ LỌC GIẢNG VIÊN DỰA TRÊN DỮ LIỆU ĐÃ TỔNG HỢP
        function populateFilterDropdown() {
            const select = document.getElementById('filter-person');
            const currentSelected = select.value;
            
            select.innerHTML = '<option value="ALL">-- Tất cả giảng viên --</option>';
            
            let persons = new Set();
            allData.forEach(item => {
                item.teachersSet.forEach(p => persons.add(p));
            });

            Array.from(persons).sort((a,b) => a.localeCompare(b, 'vi')).forEach(p => {
                let option = document.createElement('option');
                option.value = p;
                option.textContent = p;
                select.appendChild(option);
            });

            if (Array.from(select.options).some(o => o.value === currentSelected)) {
                select.value = currentSelected;
            }
        }

        // 5. HIỂN THỊ DỮ LIỆU DẠNG TREE-TABLE (DÒNG CHA - DÒNG CON)
        function renderTable(dataArray, selectedPerson) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="empty-message">Không tìm thấy dữ liệu phù hợp.</td></tr>';
                return;
            }

            dataArray.forEach(item => {
                // Chỉ lấy những nhiệm vụ con thỏa mãn điều kiện lọc
                let displayTasks = selectedPerson === "ALL" 
                    ? item.tasks 
                    : item.tasks.filter(t => t.teacherName === selectedPerson);

                if (displayTasks.length === 0) return; // Nếu lọc mà không có task nào thì ẩn luôn dòng cha

                let teacherArray = Array.from(item.teachersSet);
                let teacherBadges = teacherArray.length > 0 
                    ? teacherArray.map(t => `<span class="person-tag">${t}</span>`).join(' ')
                    : '<span style="color:#94a3b8; font-style:italic">Chưa phân công</span>';

                let isExpanded = selectedPerson !== "ALL"; // Tự động mở rộng nhánh nếu đang lọc 1 người cụ thể
                let maNguonBadge = item.maNguon ? `<span class="source-badge">${item.maNguon}</span> ` : '';

                // DÒNG CHA (GỘP ĐẦU VIỆC)
                let masterTr = document.createElement('tr');
                masterTr.className = 'master-row';
                masterTr.onclick = function() { toggleKpi(item.id); };
                
                masterTr.innerHTML = `
                    <td style="font-weight: 700; color: #1e293b; padding-left:15px;">
                        <button class="btn-toggle">
                            <i id="icon-toggle-${item.id}" class="fa-solid ${isExpanded ? 'fa-chevron-down' : 'fa-chevron-right'}"></i>
                        </button>
                        ${maNguonBadge} ${item.dauViec} 
                        <span style="font-size:12px; font-weight:normal; color:#64748b; margin-left:6px;">(${displayTasks.length} tác vụ)</span>
                    </td>
                    <td>${teacherBadges}</td>
                    <td style="color:#64748b; font-size:13px; font-style:italic;">Xem chi tiết bên dưới</td>
                    <td style="text-align: center;">—</td>
                `;
                tbody.appendChild(masterTr);

                // CÁC DÒNG CON (CHI TIẾT NHIỆM VỤ TỪNG NGƯỜI)
                displayTasks.forEach(task => {
                    let childLinkHTML = task.linkText && task.linkText.startsWith('http')
                        ? `<a href="${task.linkText}" target="_blank" class="btn-evidence"><i class="fa-solid fa-link"></i> Mở link</a>`
                        : `<span class="badge-missing">Chưa có</span>`;

                    let childTr = document.createElement('tr');
                    childTr.className = `child-row child-of-${item.id}`;
                    if (isExpanded) childTr.style.display = 'table-row';

                    childTr.innerHTML = `
                        <td style="padding-left: 45px; color: #334155;">
                            <i class="fa-regular fa-circle-dot" style="font-size:10px; color:var(--primary-color); margin-right:8px;"></i>
                            ${task.chiTiet || '<span style="color:#94a3b8; font-style:italic">Chưa có mô tả cụ thể</span>'}
                        </td>
                        <td><span class="person-tag"><i class="fa-solid fa-user-check"></i> ${task.teacherName}</span></td>
                        <td style="color: #475569;">${task.minhChungText || '—'}</td>
                        <td style="text-align: center;">${childLinkHTML}</td>
                    `;
                    tbody.appendChild(childTr);
                });
            });
        }

        // BẬT / TẮT ẨN HIỆN CÁC DÒNG CON
        function toggleKpi(safeKpiId) {
            const childRows = document.getElementsByClassName(`child-of-${safeKpiId}`);
            const btnIcon = document.getElementById(`icon-toggle-${safeKpiId}`);
            
            if (childRows.length === 0) return;

            let isCurrentlyHidden = childRows[0].style.display === 'none' || childRows[0].style.display === '';

            for(let i = 0; i < childRows.length; i++) {
                childRows[i].style.display = isCurrentlyHidden ? 'table-row' : 'none';
            }

            if (btnIcon) {
                btnIcon.className = isCurrentlyHidden ? 'fa-solid fa-chevron-down' : 'fa-solid fa-chevron-right';
            }
        }

        // THỰC THI LỌC DỮ LIỆU
        function applyFilter() {
            let selectedPerson = document.getElementById('filter-person').value;

            let filteredData = allData.filter(item => {
                if (selectedPerson === "ALL") return true;
                return item.teachersSet.has(selectedPerson);
            });

            renderTable(filteredData, selectedPerson);
        }
    </script>
</body>
</html>
