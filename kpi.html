<!DOCTYPE html>
<html lang="vi">
<head>
    /* tên file dữ liệu: Phan_cong_KPI_Chi_tiet_Khoa.xlsx */
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân Công KPI Chi Tiết</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #1a4d2e;
            --teacher-color: #0b694a;
            --secondary-color: #f4f6f9;
            --text-color: #333;
            --border-color: #e2e8f0;
            --link-color: #2563eb;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #ffffff;
            color: var(--text-color);
            padding: 20px;
            font-size: 15px;
        }

        .container { max-width: 1200px; margin: 0 auto; }

        /* --- HEADER & NAVBAR --- */
        .top-navbar {
            display: flex; justify-content: space-between; align-items: center;
            background-color: var(--secondary-color); margin-bottom: 30px; padding: 0 10px 0 20px;
            border-radius: 8px;
        }
        .logo-box { display: flex; align-items: center; }
        .logo-img { height: 45px; object-fit: contain; margin: 10px 0; }
        .nav-menu { display: flex; list-style: none; height: 100%; }
        .nav-item {
            text-decoration: none; color: #333; padding: 22px 25px; font-weight: 500; font-size: 15px;
            transition: background-color 0.2s; border-bottom: 3px solid transparent; display: flex; align-items: center;
        }
        .nav-item:hover { background-color: #e2e8f0; }
        .nav-item.active { background-color: #ffffff; border-bottom: 3px solid #000000; font-weight: bold; }

        .header-title {
            text-align: center; color: var(--primary-color); margin-bottom: 25px;
            font-size: 22px; text-transform: uppercase; font-weight: 700;
        }

        /* --- VÙNG LỌC DỮ LIỆU --- */
        .filter-section {
            display: flex; gap: 20px; margin-bottom: 25px; background: var(--secondary-color);
            padding: 20px; border-radius: 8px; align-items: flex-end; flex-wrap: wrap;
        }
        .filter-group { display: flex; flex-direction: column; gap: 8px; flex: 1; min-width: 250px; }
        .filter-group label { font-weight: 600; color: #4a5568; font-size: 13px; text-transform: uppercase; }
        .filter-group select {
            padding: 10px 12px; border-radius: 4px; border: 1px solid #cbd5e0; outline: none;
            font-size: 14px; width: 100%; cursor: pointer; background-color: white; font-family: inherit;
        }
        .filter-group select:focus { border-color: var(--primary-color); }

        /* --- BẢNG DỮ LIỆU --- */
        .table-responsive { 
            overflow-x: auto; 
            border-radius: 8px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            -webkit-overflow-scrolling: touch;
        }
        
        table { width: 100%; border-collapse: collapse; background-color: white; min-width: 900px; }
        thead { background-color: var(--primary-color); color: white; }
        th, td { padding: 14px 15px; border-bottom: 1px solid var(--border-color); }
        th { font-weight: 600; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; text-align: center; white-space: nowrap; }
        
        /* Căn chỉnh các cột */
        td { font-size: 14px; line-height: 1.5; }
        th:nth-child(2), td:nth-child(2) { text-align: left; } /* Mã công việc */
        th:nth-child(3), td:nth-child(3) { text-align: left; } /* Công việc chi tiết */
        th:nth-child(4), td:nth-child(4) { text-align: left; } /* Người phụ trách */
        th:nth-child(5), td:nth-child(5) { text-align: center; } /* Minh chứng */

        /* Highlight tên người phụ trách { text-align: center; font-weight: bold; color: #475569; }*/
        td:nth-child(4) { font-weight: 600; color: var(--teacher-color); }

        /* Nút và Badge cho phần Minh chứng */
        .btn-evidence {
            display: inline-block; padding: 6px 12px; background-color: #e0f2fe; color: var(--link-color);
            border-radius: 4px; text-decoration: none; font-weight: 600; font-size: 13px;
            border: 1px solid #bae6fd; transition: all 0.2s; white-space: nowrap;
        }
        .btn-evidence:hover { background-color: #bae6fd; color: #1d4ed8; }
        
        .badge-missing {
            display: inline-block; padding: 6px 12px; background-color: #fee2e2; color: #991b1b;
            border-radius: 20px; font-size: 13px; font-weight: bold; border: 1px solid #fecaca; white-space: nowrap;
        }

        /* Cố định cột STT và Mã CV khi vuốt ngang trên điện thoại */
        @media (max-width: 768px) {
            th:nth-child(1), td:nth-child(1) { position: sticky; left: 0; background-color: inherit; z-index: 2; border-right: 1px solid #e2e8f0; }
            th:nth-child(1) { background-color: var(--primary-color); color: white; border-right: none;}
        }

        tbody tr { background-color: #ffffff; transition: background-color 0.2s ease; }
        tbody tr:nth-child(even) { background-color: #fbfbfb; }
        tbody tr:hover { background-color: #f1f5f9; }

        .empty-message { text-align: center; padding: 40px; color: #718096; font-style: italic; }

        #loading { text-align: center; padding: 20px; color: var(--primary-color); font-weight: bold; font-size: 16px; display: none; }
        #sync-indicator { text-align: center; font-size: 12px; color: #718096; margin-top: 20px; font-style: italic; }

        /* --- MOBILE TWEAKS --- */
        @media (max-width: 768px) {
            .top-navbar { flex-direction: column; padding: 15px; gap: 15px; }
            .nav-menu { width: 100%; justify-content: space-around; }
            .nav-item { padding: 10px; font-size: 14px; }
            .filter-section { flex-direction: column; align-items: stretch; gap: 15px; padding: 15px; }
            .filter-group { min-width: 100%; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- HEADER NAVBAR -->
        <div class="top-navbar">
            <div class="logo-box">
                <img src="https://raw.githubusercontent.com/khcbvadl-ai/quanlidulieu/main/logo.%20KHCB%20trong.png" alt="KHCB LOGO" class="logo-img">
            </div>
            <div class="nav-menu">
                <a href="#" class="nav-item">Trang chủ</a>
                <a href="#" class="nav-item">Lịch giảng</a>
                <a href="#" class="nav-item active">Phân công KPI</a>
            </div>
        </div>

        <h2 class="header-title"><i class="fa-solid fa-list-check"></i> PHÂN CÔNG KPI CHI TIẾT KHOA</h2>

        <!-- BỘ LỌC -->
        <div class="filter-section">
            <div class="filter-group">
                <label for="filter-year"><i class="fa-regular fa-calendar-days"></i> Chọn năm học:</label>
                <select id="filter-year" onchange="changeYear()">
                    <option value="2026-2027">Năm học 2026-2027</option>
                    <option value="2027-2028">Năm học 2027-2028</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-teacher"><i class="fa-solid fa-chalkboard-user"></i> Người phụ trách:</label>
                <select id="filter-teacher" onchange="applyFilter()">
                    <option value="ALL">-- Tất cả người phụ trách --</option>
                </select>
            </div>
        </div>

        <div id="loading"><i class="fa-solid fa-spinner fa-spin"></i> Đang tải dữ liệu năm học...</div>

        <!-- BẢNG HIỂN THỊ DỮ LIỆU -->
        <div class="table-responsive">
            <table id="kpi-table" style="display: none;">
                <thead>
                    <tr>
                        <th style="width: 60px;">STT</th>
                        <th style="width: 120px;">MÃ CÔNG VIỆC</th>
                        <th>CÔNG VIỆC CHI TIẾT</th>
                        <th style="width: 300px;">NGƯỜI PHỤ TRÁCH</th>
                        <th style="width: 150px;">MINH CHỨNG</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Dữ liệu từ Sheet sẽ được vẽ vào đây -->
                </tbody>
            </table>
        </div>
        
        <div id="sync-indicator"></div>
    </div>

    <script>
        const SHEET_ID = "1vWJ_bkiGPEHQyTKhmwDPfsU3YT_ldIhZ";
        let allKPIData = [];
        let currentYear = "2026-2027"; 

        window.onload = function() {
            document.getElementById('filter-year').value = currentYear;
            loadDataForYear(currentYear, false);
        };

        function changeYear() {
            currentYear = document.getElementById('filter-year').value;
            document.getElementById('filter-teacher').innerHTML = '<option value="ALL">-- Tất cả người phụ trách --</option>'; 
            loadDataForYear(currentYear, false);
        }

        function parseCSVLine(text) {
            let result = [];
            let entry = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                if (inQuotes) {
                    if (c === '"') {
                        if (i + 1 < text.length && text[i + 1] === '"') { entry += '"'; i++; }
                        else { inQuotes = false; }
                    } else { entry += c; }
                } else {
                    if (c === '"') { inQuotes = true; }
                    else if (c === ',') { result.push(entry); entry = ''; }
                    else { entry += c; }
                }
            }
            result.push(entry);
            return result;
        }

        function loadDataForYear(year, isBackgroundSync) {
            // Nâng cấp bộ nhớ đệm lên V2 do thay đổi cấu trúc số cột
            const CACHE_KEY = "KPI_CACHE_V2_" + year;
            const cachedDataString = localStorage.getItem(CACHE_KEY);
            let hasCache = false;

            if (cachedDataString) {
                try {
                    allKPIData = JSON.parse(cachedDataString);
                    hasCache = true;
                    
                    document.getElementById('kpi-table').style.display = 'table';
                    populateTeacherDropdown();
                    applyFilter();
                    
                    document.getElementById('sync-indicator').innerHTML = '<i class="fa-solid fa-cloud-arrow-down"></i> Đang kiểm tra dữ liệu mới...';
                } catch (e) {
                    console.error("Lỗi đọc cache:", e);
                }
            }

            if (!isBackgroundSync && !hasCache) {
                document.getElementById('loading').style.display = 'block';
                document.getElementById('kpi-table').style.display = 'none';
                document.getElementById('table-body').innerHTML = '';
            }

            const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${year}`;

            fetch(CSV_URL)
                .then(response => response.text())
                .then(text => {
                    let lines = text.split(/\r?\n/);
                    let rawData = [];
                    
                    for (let i = 1; i < lines.length; i++) { // Bỏ qua dòng tiêu đề
                        if (!lines[i].trim()) continue;
                        let cols = parseCSVLine(lines[i]);
                        
                        let stt = parseInt(cols[0]);
                        if (!isNaN(stt) && stt > 0) {
                            rawData.push({
                                stt: stt,
                                maCV: (cols.length > 1 && cols[1]) ? cols[1].trim() : "",
                                jobDetail: (cols.length > 2 && cols[2]) ? cols[2].trim() : "",
                                inCharge: (cols.length > 3 && cols[3]) ? cols[3].trim() : "",
                                evidenceLink: (cols.length > 4 && cols[4]) ? cols[4].trim() : ""
                            });
                        }
                    }

                    const newDataString = JSON.stringify(rawData);
                    
                    if (newDataString !== cachedDataString) {
                        localStorage.setItem(CACHE_KEY, newDataString);
                        allKPIData = rawData;
                        
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('kpi-table').style.display = 'table';
                        
                        populateTeacherDropdown();
                        applyFilter();
                    } else if (!isBackgroundSync && !hasCache) {
                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('kpi-table').style.display = 'table';
                    }
                    
                    document.getElementById('sync-indicator').innerHTML = `<i class="fa-solid fa-check-circle" style="color: green;"></i> Dữ liệu KPI năm học ${year} đã được đồng bộ`;
                })
                .catch(err => {
                    console.error("Lỗi đồng bộ:", err);
                    if (!isBackgroundSync && !hasCache) {
                        document.getElementById('loading').innerHTML = '<span style="color:red">Lỗi tải dữ liệu. Vui lòng kiểm tra quyền truy cập link Google Sheet.</span>';
                    } else {
                        document.getElementById('sync-indicator').innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color: orange;"></i> Đang dùng dữ liệu cũ (Ngoại tuyến)';
                    }
                });
        }

        // Tự động tách tên và điền vào Dropdown
        function populateTeacherDropdown() {
            const select = document.getElementById('filter-teacher');
            const currentSelected = select.value;
            
            select.innerHTML = '<option value="ALL">-- Tất cả người phụ trách --</option>';
            
            let teachers = new Set();
            
            // Quét cột inCharge, tách bằng dấu phẩy
            allKPIData.forEach(item => {
                if (item.inCharge) {
                    let parts = item.inCharge.split(',');
                    parts.forEach(part => {
                        let t = part.trim();
                        if (t && t !== "") teachers.add(t);
                    });
                }
            });

            // Đổ tên giảng viên vào danh sách
            Array.from(teachers).sort((a,b) => a.localeCompare(b, 'vi')).forEach(t => {
                let option = document.createElement('option');
                option.value = t;
                option.textContent = t;
                select.appendChild(option);
            });

            // Khôi phục lại trạng thái người đang chọn (nếu có)
            let matchFound = false;
            for(let i = 0; i < select.options.length; i++){
                if(select.options[i].value === currentSelected){
                    matchFound = true;
                    break;
                }
            }
            if(matchFound) select.value = currentSelected;
        }

        function renderTable(dataArray) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            if (dataArray.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" class="empty-message">Không tìm thấy công việc KPI nào phù hợp.</td></tr>';
                return;
            }

            dataArray.forEach(item => {
                // Xử lý logic cột Minh chứng
                let evidenceHTML = '';
                if (item.evidenceLink && item.evidenceLink !== "") {
                    // Nếu có link, hiển thị nút bấm chuyển hướng
                    evidenceHTML = `<a href="${item.evidenceLink}" target="_blank" class="btn-evidence"><i class="fa-solid fa-link"></i> Xem minh chứng</a>`;
                } else {
                    // Nếu không có link, hiển thị nhãn báo chưa có
                    evidenceHTML = `<span class="badge-missing">Chưa có</span>`;
                }

                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="font-weight: bold; text-align: center;">${item.stt}</td>
                    <td>${item.maCV}</td>
                    <td>${item.jobDetail}</td>
                    <td>${item.inCharge}</td>
                    <td style="text-align: center;">${evidenceHTML}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function applyFilter() {
            let selectedTeacher = document.getElementById('filter-teacher').value;

            let filteredData = allKPIData.filter(item => {
                if (selectedTeacher === "ALL") return true;
                return item.inCharge && item.inCharge.includes(selectedTeacher);
            });

            renderTable(filteredData);
        }
    </script>
</body>
</html>
